<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - BgBg Games</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: white;
            background-color: black;
        }
        .navbar {
            position: fixed;
            top: 0;
            width: calc(100% - 4px);
            background: rgba(0, 0, 0, 0.9); /* Прозрачность уменьшена до 90% */
            padding: 15px 0;
            text-align: center;
            z-index: 10;
            border: 2px solid white;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
        }
        .studio-title {
            text-align: center;
            font-size: 4rem;
            font-weight: bold;
            margin-top: 100px;
            position: relative;
            z-index: 5;
            background: linear-gradient(45deg, #ffffff, #cccccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.3),
                         4px 4px 6px rgba(255, 255, 255, 0.2),
                         6px 6px 8px rgba(255, 255, 255, 0.1);
        }
        .contact-text {
            text-align: center;
            font-size: 1.5rem;
            margin-top: 50px;
            position: relative;
            z-index: 5;
            color: white;
        }
        .contact-text a {
            color: #ff8a00;
            text-decoration: none;
        }
        .contact-text a:hover {
            text-decoration: underline;
        }
        .contact-form {
            max-width: 480px;
            margin: 30px auto 60px;
            padding: 24px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid white;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            z-index: 5;
            box-sizing: border-box;
        }
        .contact-form label {
            font-size: 1rem;
            margin-top: 8px;
        }
        .contact-form input,
        .contact-form textarea {
            font: inherit;
            font-size: 1rem;
            padding: 10px;
            color: white;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #888;
            border-radius: 4px;
            box-sizing: border-box;
            width: 100%;
        }
        .contact-form input:focus,
        .contact-form textarea:focus {
            outline: none;
            border-color: #ff8a00;
        }
        .contact-form textarea {
            resize: vertical;
        }
        .contact-form button {
            margin-top: 16px;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            color: black;
            background: #ff8a00;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .contact-form button:disabled {
            opacity: 0.6;
            cursor: default;
        }
        .contact-form .hp {
            display: none;
        }
        .form-status {
            min-height: 1.2em;
            text-align: center;
            margin-top: 8px;
        }
        .form-status.ok { color: #7CFC7C; }
        .form-status.err { color: #ff6b6b; }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }
    </style>
</head>
<body>
    <canvas id="backgroundCanvas"></canvas>
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="Contact.html">Contact</a>
    </div>
    <div class="studio-title">BgBg Games</div>
    <div class="contact-text">
        Feel free to reach out for any reason
    </div>
    <form class="contact-form" id="contactForm" action="https://api.web3forms.com/submit" method="POST">
        <!-- Web3Forms access key (не раскрывает адрес почты): получить на https://web3forms.com -->
        <input type="hidden" name="access_key" value="4bed6f7a-7140-42e4-890a-d64593d97599">
        <input type="hidden" name="subject" value="New message from BgBg Games site">
        <input type="hidden" name="from_name" value="BgBg Games site">
        <!-- Защита от ботов: скрытое поле, люди его не заполняют -->
        <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">

        <label for="name">Name</label>
        <input type="text" id="name" name="name" required maxlength="100">

        <label for="email">Your email</label>
        <input type="email" id="email" name="email" required maxlength="200">

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required maxlength="5000"></textarea>

        <button type="submit" id="submitBtn">Send</button>
        <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>
    </form>
    <script>
        // Отправка формы без перезагрузки страницы
        const form = document.getElementById('contactForm');
        const statusEl = document.getElementById('formStatus');
        const submitBtn = document.getElementById('submitBtn');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            statusEl.className = 'form-status';
            statusEl.textContent = 'Sending...';
            submitBtn.disabled = true;
            try {
                const res = await fetch(form.action, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' },
                    body: new FormData(form)
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    statusEl.className = 'form-status ok';
                    statusEl.textContent = 'Thanks! Your message has been sent.';
                    form.reset();
                } else {
                    throw new Error(data.message || 'Error');
                }
            } catch (err) {
                statusEl.className = 'form-status err';
                statusEl.textContent = 'Sorry, the message could not be sent. Please try again later.';
            } finally {
                submitBtn.disabled = false;
            }
        });

        // Анимация метеоритов
        const canvas = document.getElementById('backgroundCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Meteor {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.speed = Math.random() * 2 + 1;
                this.size = Math.random() * 3 + 2; // Размер кружочка
                this.color = `rgba(255, ${Math.random() * 100 + 155}, 0, 0.8)`; // Цвет кружочка
            }

            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.y = Math.random() * -canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); // Рисуем кружочек
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        const meteors = [];
        for (let i = 0; i < 50; i++) {
            meteors.push(new Meteor());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            meteors.forEach(meteor => {
                meteor.update();
                meteor.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
